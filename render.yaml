services:
  # -------------------------------------------------------------
  # AutoTrust AI - Django REST Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: autotrust-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: autotrust_backend
    buildCommand: ./build.sh
    startCommand: gunicorn autotrust_backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: autotrust-db
          property: connectionString

  # -------------------------------------------------------------
  # AutoTrust AI - React/Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: staticSite
    name: autotrust-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: autotrust-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # -------------------------------------------------------------
  # AutoTrust AI - PostgreSQL Database
  # -------------------------------------------------------------
  - name: autotrust-db
    databaseName: autotrust
    user: autotrust_admin
    plan: free
    region: oregon
